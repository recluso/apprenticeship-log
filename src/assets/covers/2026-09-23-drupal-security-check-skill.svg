<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1e2b"/>
      <stop offset="1" stop-color="#11131b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fe3c8"/>
      <stop offset="1" stop-color="#2fa58c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#6fe3c8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6fe3c8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="560" height="420" rx="24" fill="url(#bg)"/>
  <rect width="560" height="420" rx="24" fill="url(#glow)"/>

  <!-- Terminal: audit before and after -->
  <g transform="translate(36 40)">
    <rect width="300" height="200" rx="12" fill="#232838" stroke="#3a4160"/>
    <circle cx="18" cy="18" r="5" fill="#ff7a85"/>
    <circle cx="34" cy="18" r="5" fill="#f5b85a"/>
    <circle cx="50" cy="18" r="5" fill="#6fe3c8"/>
    <line x1="0" y1="36" x2="300" y2="36" stroke="#3a4160"/>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14">
      <text x="18" y="64" fill="#8b93ad">$ <tspan fill="#e4e7f1">composer audit</tspan></text>
      <text x="18" y="88" fill="#ff7a85">✗ 12 vulnerabilities</text>
      <text x="18" y="108" fill="#8b93ad" font-size="12">  7 packages · core + contrib</text>
      <text x="18" y="138" fill="#8b93ad">$ <tspan fill="#e4e7f1">composer update</tspan></text>
      <text x="18" y="162" fill="#8b93ad">$ <tspan fill="#e4e7f1">composer audit</tspan></text>
      <text x="18" y="186" fill="#6fe3c8">✓ 0 vulnerabilities</text>
    </g>
  </g>

  <!-- Shield -->
  <g transform="translate(372 52)">
    <path d="M76 0 L148 26 V92 C148 140 116 172 76 188 C36 172 4 140 4 92 V26 Z" fill="url(#shield)"/>
    <path d="M76 14 L136 36 V92 C136 132 110 158 76 172 C42 158 16 132 16 92 V36 Z" fill="none" stroke="#11131b" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M44 94 L68 118 L112 70" fill="none" stroke="#11131b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Saved skill: the repeatable steps -->
  <g transform="translate(36 268)">
    <rect width="488" height="112" rx="12" fill="#232838" stroke="#8b95ff" stroke-opacity="0.55"/>
    <path d="M20 18 h14 v22 l-7 -5 l-7 5 z" fill="#8b95ff"/>
    <text x="44" y="34" fill="#e4e7f1" font-size="15" font-weight="600">drupal-security-check</text>
    <text x="468" y="34" fill="#8b93ad" font-size="12" text-anchor="end">saved skill</text>
    <line x1="52" y1="74" x2="436" y2="74" stroke="#3a4160" stroke-width="2"/>
    <g font-size="12" fill="#c9cdd8" text-anchor="middle">
      <circle cx="52" cy="74" r="9" fill="#8b95ff"/>
      <text x="52" y="100">audit</text>
      <circle cx="148" cy="74" r="9" fill="#8b95ff"/>
      <text x="148" y="100">branch</text>
      <circle cx="244" cy="74" r="9" fill="#8b95ff"/>
      <text x="244" y="100">dry-run</text>
      <circle cx="340" cy="74" r="9" fill="#8b95ff"/>
      <text x="340" y="100">update</text>
      <circle cx="436" cy="74" r="9" fill="#6fe3c8"/>
      <text x="436" y="100">verify</text>
    </g>
  </g>
</svg>
