<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1e2b"/>
      <stop offset="1" stop-color="#11131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#8b95ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b95ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="560" height="420" rx="24" fill="url(#bg)"/>
  <rect width="560" height="420" rx="24" fill="url(#glow)"/>

  <!-- Calendar with Monday column highlighted -->
  <g transform="translate(36 44)">
    <rect width="238" height="252" rx="12" fill="#232838" stroke="#3a4160"/>
    <text x="18" y="30" fill="#e4e7f1" font-size="14" font-weight="600">September 2026</text>
    <rect x="12" y="44" width="30" height="170" rx="8" fill="#8b95ff" fill-opacity="0.18" stroke="#8b95ff" stroke-opacity="0.6"/>
    <g font-size="11" font-weight="700" fill="#8b93ad" text-anchor="middle">
      <text x="27" y="62" fill="#8b95ff">M</text><text x="59" y="62">T</text><text x="91" y="62">W</text><text x="123" y="62">T</text><text x="155" y="62">F</text><text x="187" y="62">S</text><text x="219" y="62">S</text>
    </g>
    <g font-size="12" fill="#c9cdd8" text-anchor="middle">
      <text x="59" y="92">1</text><text x="91" y="92">2</text><text x="123" y="92">3</text><text x="155" y="92">4</text><text x="187" y="92">5</text><text x="219" y="92">6</text>
      <text x="27" y="124" fill="#e4e7f1" font-weight="700">7</text><text x="59" y="124">8</text><text x="91" y="124">9</text><text x="123" y="124">10</text><text x="155" y="124">11</text><text x="187" y="124">12</text><text x="219" y="124">13</text>
      <text x="27" y="156" fill="#e4e7f1" font-weight="700">14</text><text x="59" y="156">15</text><text x="91" y="156">16</text><text x="123" y="156">17</text><text x="155" y="156">18</text><text x="187" y="156">19</text><text x="219" y="156">20</text>
      <text x="27" y="188" fill="#e4e7f1" font-weight="700">21</text><text x="59" y="188">22</text><text x="91" y="188">23</text><text x="123" y="188">24</text><text x="155" y="188">25</text><text x="187" y="188">26</text><text x="219" y="188">27</text>
    </g>
    <!-- entry dots -->
    <circle cx="59" cy="197" r="3" fill="#6fe3c8"/>
    <circle cx="91" cy="197" r="3" fill="#6fe3c8"/>
    <circle cx="59" cy="165" r="3" fill="#6fe3c8"/>
    <circle cx="59" cy="133" r="3" fill="#6fe3c8"/>
    <!-- Sunday edge case: jumps back to Monday -->
    <path d="M219 204 C214 244 36 250 27 224" fill="none" stroke="#f5b85a" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"/>
    <path d="M21 229 L27 219 L34 227" fill="none" stroke="#f5b85a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- The formula -->
  <g transform="translate(36 308)">
    <rect width="238" height="72" rx="12" fill="#232838" stroke="#3a4160"/>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13">
      <text x="18" y="29" fill="#8b93ad">// Sunday → back 6 days</text>
      <text x="18" y="53" fill="#e4e7f1">day === <tspan fill="#f5b85a">0</tspan> ? <tspan fill="#f5b85a">-6</tspan> : <tspan fill="#f5b85a">1</tspan></text>
    </g>
  </g>

  <!-- Arrow into the sidebar -->
  <path d="M282 160 C296 160 296 160 310 160" fill="none" stroke="#8b95ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M304 152 L314 160 L304 168" fill="none" stroke="#8b95ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Resulting grouped sidebar -->
  <g transform="translate(322 44)">
    <rect width="202" height="336" rx="12" fill="#232838" stroke="#3a4160"/>
    <text x="18" y="30" fill="#e4e7f1" font-size="14" font-weight="600">Learning Log</text>
    <line x1="0" y1="44" x2="202" y2="44" stroke="#3a4160"/>
    <g font-size="10" font-weight="700" letter-spacing="0.05em" fill="#8b95ff">
      <text x="18" y="70">WEEK COMMENCING 21/09/26</text>
      <text x="18" y="172">WEEK COMMENCING 14/09/26</text>
      <text x="18" y="232">WEEK COMMENCING 07/09/26</text>
    </g>
    <rect x="12" y="82" width="178" height="26" rx="6" fill="#8b95ff" fill-opacity="0.18"/>
    <rect x="22" y="92" width="140" height="6" rx="3" fill="#e4e7f1"/>
    <rect x="22" y="122" width="120" height="6" rx="3" fill="#4a5270"/>
    <rect x="22" y="144" width="150" height="6" rx="3" fill="#4a5270"/>
    <rect x="22" y="188" width="130" height="6" rx="3" fill="#4a5270"/>
    <rect x="22" y="248" width="144" height="6" rx="3" fill="#4a5270"/>
    <line x1="18" y1="300" x2="184" y2="300" stroke="#3a4160"/>
    <text x="18" y="322" fill="#8b93ad" font-size="11">newest first · automatic</text>
  </g>
</svg>
