<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1e2b"/>
      <stop offset="1" stop-color="#11131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#8b95ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b95ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="560" height="420" rx="24" fill="url(#bg)"/>
  <rect width="560" height="420" rx="24" fill="url(#glow)"/>

  <!-- Account page: sections that appear only when relevant -->
  <g transform="translate(36 36)">
    <rect width="250" height="348" rx="12" fill="#232838" stroke="#3a4160"/>
    <text x="18" y="30" fill="#8b93ad" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, monospace">/user/account</text>
    <line x1="0" y1="44" x2="250" y2="44" stroke="#3a4160"/>

    <!-- Your details -->
    <text x="18" y="70" fill="#e4e7f1" font-size="13" font-weight="600">Your details</text>
    <rect x="18" y="80" width="180" height="5" rx="2.5" fill="#4a5270"/>
    <rect x="18" y="90" width="140" height="5" rx="2.5" fill="#4a5270"/>
    <rect x="18" y="102" width="124" height="17" rx="8.5" fill="#6fe3c8" fill-opacity="0.16" stroke="#6fe3c8"/>
    <text x="27" y="114" fill="#6fe3c8" font-size="10.5">if details are visible</text>

    <!-- Set password -->
    <text x="18" y="146" fill="#e4e7f1" font-size="13" font-weight="600">Set password</text>
    <rect x="18" y="156" width="146" height="17" rx="8.5" fill="#6fe3c8" fill-opacity="0.16" stroke="#6fe3c8"/>
    <text x="27" y="168" fill="#6fe3c8" font-size="10.5">if a password field exists</text>

    <!-- Member messaging -->
    <text x="18" y="200" fill="#e4e7f1" font-size="13" font-weight="600">Member messaging</text>
    <rect x="18" y="210" width="196" height="5" rx="2.5" fill="#4a5270"/>
    <rect x="18" y="220" width="160" height="5" rx="2.5" fill="#4a5270"/>
    <rect x="18" y="232" width="92" height="17" rx="8.5" fill="#6fe3c8" fill-opacity="0.16" stroke="#6fe3c8"/>
    <text x="27" y="244" fill="#6fe3c8" font-size="10.5">members only</text>

    <!-- Old fields: hidden, not deleted -->
    <rect x="14" y="264" width="222" height="36" rx="8" fill="none" stroke="#f5b85a" stroke-opacity="0.7" stroke-dasharray="4 4"/>
    <text x="26" y="280" fill="#f5b85a" font-size="11" font-weight="600">4 old heading fields</text>
    <text x="26" y="293" fill="#8b93ad" font-size="10.5">hidden per render · config untouched</text>

    <!-- Welcome block: retired -->
    <rect x="14" y="306" width="222" height="30" rx="8" fill="none" stroke="#ff7a85" stroke-opacity="0.7" stroke-dasharray="4 4"/>
    <text x="26" y="325" fill="#8b93ad" font-size="10.5"><tspan fill="#ff7a85" font-weight="600">welcome block</tspan> → removed on deploy</text>
  </g>

  <!-- Test results -->
  <g transform="translate(302 36)">
    <rect width="222" height="172" rx="12" fill="#232838" stroke="#3a4160"/>
    <text x="18" y="30" fill="#8b93ad" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, monospace">automated checks</text>
    <line x1="0" y1="44" x2="222" y2="44" stroke="#3a4160"/>
    <text x="18" y="88" fill="#e4e7f1" font-size="34" font-weight="700">79</text>
    <text x="68" y="87" fill="#6fe3c8" font-size="13" font-weight="600">✓ all pass</text>
    <rect x="18" y="106" width="82" height="10" rx="3" fill="#8b95ff"/>
    <text x="110" y="115" fill="#c9cdd8" font-size="11">41 server-side</text>
    <rect x="18" y="128" width="46" height="10" rx="3" fill="#c7a2ff"/>
    <text x="110" y="137" fill="#c9cdd8" font-size="11">23 HTTP, logged in</text>
    <rect x="18" y="150" width="30" height="10" rx="3" fill="#f5b85a"/>
    <text x="110" y="159" fill="#c9cdd8" font-size="11">15 messaging</text>
  </g>

  <!-- Rehearsing the deletion -->
  <g transform="translate(302 224)">
    <rect width="222" height="160" rx="12" fill="#232838" stroke="#3a4160"/>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5">
      <text x="18" y="32" fill="#8b95ff">BEGIN;</text>
      <text x="18" y="54" fill="#e4e7f1">DELETE welcome block</text>
      <text x="18" y="76" fill="#8b93ad">-- what breaks?</text>
      <text x="18" y="98" fill="#f5b85a">ROLLBACK;</text>
    </g>
    <line x1="18" y1="114" x2="204" y2="114" stroke="#3a4160"/>
    <text x="18" y="140" fill="#6fe3c8" font-size="12" font-weight="600">✓ no config changes</text>
  </g>
</svg>
