<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1e2b"/>
      <stop offset="1" stop-color="#11131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#8b95ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b95ff" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8b95ff"/>
    </marker>
  </defs>

  <rect width="560" height="420" rx="24" fill="url(#bg)"/>
  <rect width="560" height="420" rx="24" fill="url(#glow)"/>

  <!-- Login page with help cards and a message beneath -->
  <g transform="translate(36 36)">
    <rect width="268" height="348" rx="12" fill="#232838" stroke="#3a4160"/>
    <text x="18" y="30" fill="#8b93ad" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, monospace">/user/login</text>
    <line x1="0" y1="44" x2="268" y2="44" stroke="#3a4160"/>

    <!-- Four cards, 2 x 2 -->
    <g>
      <rect x="18" y="60" width="110" height="66" rx="8" fill="#1b1e2b" stroke="#8b95ff"/>
      <circle cx="73" cy="83" r="10" fill="#8b95ff" fill-opacity="0.25" stroke="#8b95ff"/>
      <text x="73" y="112" text-anchor="middle" fill="#e4e7f1" font-size="11">Reset password</text>

      <rect x="140" y="60" width="110" height="66" rx="8" fill="#1b1e2b" stroke="#8b95ff"/>
      <circle cx="195" cy="83" r="10" fill="#8b95ff" fill-opacity="0.25" stroke="#8b95ff"/>
      <text x="195" y="112" text-anchor="middle" fill="#e4e7f1" font-size="11">Read our FAQ</text>

      <rect x="18" y="136" width="110" height="66" rx="8" fill="#1b1e2b" stroke="#8b95ff"/>
      <circle cx="73" cy="159" r="10" fill="#8b95ff" fill-opacity="0.25" stroke="#8b95ff"/>
      <text x="73" y="188" text-anchor="middle" fill="#e4e7f1" font-size="11">Partner login</text>

      <rect x="140" y="136" width="110" height="66" rx="8" fill="#1b1e2b" stroke="#8b95ff"/>
      <circle cx="195" cy="159" r="10" fill="#8b95ff" fill-opacity="0.25" stroke="#8b95ff"/>
      <text x="195" y="188" text-anchor="middle" fill="#e4e7f1" font-size="11">Contact us</text>
    </g>

    <!-- Message beneath the cards -->
    <rect x="18" y="214" width="232" height="32" rx="6" fill="#f5b85a" fill-opacity="0.12"/>
    <rect x="18" y="214" width="4" height="32" rx="2" fill="#f5b85a"/>
    <text x="32" y="234" fill="#f5b85a" font-size="11" font-weight="600">Optional message beneath</text>

    <!-- Login form stub -->
    <rect x="18" y="262" width="232" height="18" rx="5" fill="none" stroke="#3a4160"/>
    <rect x="18" y="288" width="232" height="18" rx="5" fill="none" stroke="#3a4160"/>
    <rect x="94" y="316" width="80" height="20" rx="6" fill="#4a5270"/>
    <text x="134" y="330" text-anchor="middle" fill="#e4e7f1" font-size="10.5">Login</text>
  </g>

  <!-- Component folders -->
  <g transform="translate(320 36)">
    <rect width="204" height="170" rx="12" fill="#232838" stroke="#3a4160"/>
    <text x="18" y="30" fill="#8b93ad" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, monospace">components/</text>
    <line x1="0" y1="44" x2="204" y2="44" stroke="#3a4160"/>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5">
      <text x="18" y="68" fill="#8b95ff">link-card/</text>
      <text x="34" y="86" fill="#c9cdd8">.component.yml</text>
      <text x="34" y="104" fill="#c9cdd8">.twig  .css</text>
      <text x="18" y="128" fill="#8b95ff">link-card-grid/</text>
      <text x="34" y="146" fill="#c9cdd8">.yml .twig .css</text>
    </g>
    <text x="34" y="162" fill="#8b93ad" font-size="10.5">cards + message slots</text>
  </g>

  <!-- Content -> glue -> SDC -->
  <g transform="translate(320 222)">
    <rect width="204" height="162" rx="12" fill="#232838" stroke="#3a4160"/>
    <rect x="18" y="16" width="168" height="28" rx="7" fill="none" stroke="#6fe3c8"/>
    <text x="102" y="34" text-anchor="middle" fill="#6fe3c8" font-size="11.5" font-weight="600">Block + Paragraphs</text>
    <line x1="102" y1="44" x2="102" y2="64" stroke="#8b95ff" stroke-width="1.25" marker-end="url(#arrow)"/>
    <rect x="18" y="66" width="168" height="28" rx="7" fill="none" stroke="#c7a2ff"/>
    <text x="102" y="84" text-anchor="middle" fill="#c7a2ff" font-size="11.5" font-weight="600">4 glue templates</text>
    <line x1="102" y1="94" x2="102" y2="114" stroke="#8b95ff" stroke-width="1.25" marker-end="url(#arrow)"/>
    <rect x="18" y="116" width="168" height="28" rx="7" fill="#8b95ff" fill-opacity="0.16" stroke="#8b95ff"/>
    <text x="102" y="134" text-anchor="middle" fill="#e4e7f1" font-size="11.5" font-weight="600">SDC components</text>
  </g>
</svg>
